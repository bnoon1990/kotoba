[project]
name = "kotoba"
version = "0.1.0"
description = "Japanese study MCP tool"
readme = "README.md"
authors = [{ name = "Ben Noon", email = "bnoon1990@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["mcp[cli]>=2.3.0", "pydantic>=2.14.1"]

[project.scripts]
kotoba = "kotoba:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.1"]
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
